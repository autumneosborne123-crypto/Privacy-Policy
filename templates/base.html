<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branding | upper }} | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top px-lg-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/{% if token %}?token={{ token }}{% endif %}">
                <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-2 shadow" style="width: 32px; height: 32px;">
                    <i class="fas fa-flower text-white smaller"></i>
                </div>
                {{ branding }}
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link px-3" href="/{% if token %}?token={{ token }}{% endif %}#features">Features</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/commands{% if token %}?token={{ token }}{% endif %}">Commands</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="https://discord.gg/flowerbot" target="_blank">Support</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if token %}
                    <div class="dropdown">
                        <a class="btn btn-darker rounded-pill px-4 py-2 border border-secondary border-opacity-25 dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-2"></i> Account
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark bg-darker border-secondary border-opacity-25 shadow-lg">
                            <li><a class="dropdown-item" href="/dashboard?token={{ token }}"><i class="fas fa-th-large me-2"></i> Dashboard</a></li>
                            <li><hr class="dropdown-divider opacity-10"></li>
                            <li><a class="dropdown-item text-danger" href="/"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </div>
                    {% else %}
                    <a class="btn btn-primary btn-sm px-4 py-2 rounded-pill shadow" href="/login"><i class="fab fa-discord me-2"></i>Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
